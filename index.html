<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المسابقة</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .success { color: #28a745; }
        .success svg { width: 60px; height: 60px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div id="form-box">
        <h2>دخول المسابقة 🏆</h2>
        <p>اكتب اسم حسابك لتسجيل الدخول:</p>
        <input type="text" id="username" placeholder="@username" required>
        <button onclick="sendData()">دخول</button>
    </div>

    <div id="success-box" class="hidden success">
        <svg viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="3">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 12l3 3 5-5"/>
        </svg>
        <h3>تم الدخول بنجاح!</h3>
    </div>
</div>

<script>
function sendData() {
    const user = document.getElementById('username').value.trim();
    if (!user) return alert('فضلاً اكتب اسم الحساب!');

    // إخفاء النموذج وإظهار شاشة النجاح
    document.getElementById('form-box').classList.add('hidden');
    document.getElementById('success-box').classList.remove('hidden');

    // إرسال البيانات المباشر إلى Web3Forms عبر المفتاح الخاص بك
    const data = new FormData();
    data.append("access_key", "45b47b3b-22ab-4fa5-adc6-0afe362588bc");
    data.append("subject", "🏆 مشارك جديد في المسابقة");
    data.append("اسم الحساب المشارك", user);

    fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: data
    });
}
</script>

</body>
</html>
