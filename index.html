<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المسابقة</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: radial-gradient(circle at center, #180a29 0%, #05030a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        .card {
            background: rgba(22, 14, 35, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(157, 78, 221, 0.3);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(123, 44, 191, 0.25);
            width: 90%;
            max-width: 360px;
            text-align: center;
            animation: cardAppear 0.6s ease-out;
        }

        h2 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            text-shadow: 0 0 12px rgba(199, 125, 255, 0.6);
        }

        p {
            color: #b8a7d1;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: rgba(10, 6, 18, 0.7);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 12px;
            font-size: 16px;
            color: #fff;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder { color: #6d597a; }

        input:focus {
            border-color: #c77dff;
            box-shadow: 0 0 18px rgba(199, 125, 255, 0.5);
            background: rgba(15, 8, 28, 0.9);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.5);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(157, 78, 221, 0.8);
            background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%);
        }

        button:active {
            transform: translateY(0);
        }

        .hidden { display: none; }

        /* أنيميشن النجاح */
        .success {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success svg {
            width: 75px;
            height: 75px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 12px rgba(199, 125, 255, 0.8));
        }

        .success h3 {
            color: #c77dff;
            margin: 0;
            font-size: 22px;
            text-shadow: 0 0 12px rgba(199, 125, 255, 0.5);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card">
    <div id="form-box">
        <h2>دخول المسابقة 🏆</h2>
        <p>اكتب اسم حسابك لتسجيل الدخول:</p>
        <input type="text" id="username" placeholder="@username" required>
        <button onclick="sendData()">دخول</button>
    </div>

    <div id="success-box" class="hidden success">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c77dff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke="#7b2cbf" fill="rgba(123, 44, 191, 0.25)"/>
            <path d="M8 12l3 3 5-5"/>
        </svg>
        <h3>تم الدخول بنجاح!</h3>
    </div>
</div>

<script>
function sendData() {
    const user = document.getElementById('username').value.trim();
    if (!user) return alert('فضلاً اكتب اسم الحساب!');

    // إخفاء النموذج وإظهار شاشة النجاح
    document.getElementById('form-box').classList.add('hidden');
    document.getElementById('success-box').classList.remove('hidden');

    // إرسال البيانات المباشر إلى Web3Forms عبر المفتاح الخاص بك
    const data = new FormData();
    data.append("access_key", "45b47b3b-22ab-4fa5-adc6-0afe362588bc");
    data.append("subject", "🏆 مشارك جديد في المسابقة");
    data.append("اسم الحساب المشارك", user);

    fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: data
    });
}
</script>

</body>
</html>
